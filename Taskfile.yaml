# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  # Internal constant - used when resolving empty agents
  DEFAULT_AGENTS:
    - pi
    - opencode
    - codex
    - claude-code
    - github-copilot
    - kiro-cli
  AGENTS: '{{.AGENTS | default (.DEFAULT_AGENTS | join ",") }}'
  SKILL_DIRS:
    map:
      claude-code: "$HOME/.claude/skills"
      codex: "$HOME/.codex/skills"
      github-copilot: "$HOME/.copilot/skills"
      kiro-cli: "$HOME/.kiro/skills"
      opencode: "$HOME/.config/opencode/skills"
      pi: "$HOME/.pi/agent/skills"
  SKILLS_METADATA:
    - repo: ansidev/kiro
      skills:
        - '*'
    - repo: ansidev/prompt-master
      skills:
        - '*'
    - repo: anthropics/skills
      skills:
        - 'skill-creator'
    - repo: blader/humanizer
      skills:
        - 'humanizer'
    - repo: DietrichGebert/ponytail
      skills:
        - 'ponytail'
    - repo: herdrdev/herdr
      skills:
        - 'herdr'
    - repo: inkeep/open-knowledge-skills
      skills:
        - 'skills/core/open-knowledge-discovery'
        - 'skills/core/open-knowledge'
        - 'skills/core/open-knowledge-write-skill'
        - 'skills/starter-packs/worldbuilding/worldbuilding'
        - 'skills/starter-packs/personal-crm/personal-crm'
        - 'skills/starter-packs/okf-knowledge-base/okf-knowledge-base'
        - 'skills/starter-packs/codebase-wiki/codebase-wiki'
        - 'skills/starter-packs/note-taking/note-taking'
        - 'skills/starter-packs/writing-workflow/writing-workflow'
        - 'skills/starter-packs/knowledge-base/research-with-sources'
        - 'skills/starter-packs/knowledge-base/knowledge-base'
        - 'skills/starter-packs/knowledge-base/consolidate-notes'
        - 'skills/starter-packs/software-lifecycle/record-a-decision'
        - 'skills/starter-packs/software-lifecycle/review-a-design'
        - 'skills/starter-packs/software-lifecycle/frame-a-proposal'
        - 'skills/starter-packs/software-lifecycle/write-a-spec'
        - 'skills/starter-packs/software-lifecycle/write-a-postmortem'
        - 'skills/starter-packs/software-lifecycle/software-lifecycle'
    - repo: krzysztofdudek/ResearcherSkill
      skills:
        - 'researcher'
    - repo: kunchenguid/gh-axi
      skills:
        - 'gh-axi'
    - repo: manaflow-ai/cmux
      skills:
        - '*'
    - repo: obra/superpowers
      skills:
        - '*'
    - repo: smyrick/skills
      skills:
        - 'codebase-summary'

tasks:
  prepare:
    desc: Install the GitHub CLI (gh) via Homebrew when missing.
    cmds:
      - cmd: |
          if ! command -v brew >/dev/null 2>&1; then
            echo "prepare: skipped (Homebrew not found)."
            exit 0
          fi
          brew trust /opt/homebrew
          if [ $? -ne 0 ]; then
            echo "Error: brew trust failed." >&2
            exit 1
          fi
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
            if [ $? -ne 0 ]; then
              echo "Error: brew install gh failed." >&2
              exit 1
            fi
          fi
          echo "Done preparation."
    silent: true

  install:
    desc: |
      Install all agent skills from skills.txt.
      Optional inputs:
      AGENTS (optional, comma-separated list of agent names)
    cmds:
      - task: install-all-local-skills
      - for:
          var: SKILLS_METADATA
        task: install-skills-from-repo
        vars:
          REPO: '{{.ITEM.repo}}'
          SKILLS: '{{join "," .ITEM.skills}}'
      - echo "All skills installed successfully."

  install-parallel:
    desc: |
      Install all agent skills from skills.txt in parallel.
      Optional inputs:
      AGENTS (optional, comma-separated list of agent names)
    deps:
      - task: install-all-local-skills
      - for:
          var: SKILLS_METADATA
        task: install-skills-from-repo
        vars:
          REPO: '{{.ITEM.repo}}'
          SKILLS: '{{join "," .ITEM.skills}}'
    cmds:
      - echo "All skills installed successfully."

  install-skills-from-repo:
    desc: |
      Install the agent skills from GitHub repository.
      Optional inputs:
      REPO (GitHub repository in the format "owner/repo"),
      SKILLS (comma-separated list of skill names or "*" for all skills),
      AGENTS (optional, comma-separated list of agent names)
    cmds:
      - if: '{{eq .SKILLS "*"}}'
        task: install-all-skills-from-repo
        vars:
          REPO: '{{.REPO}}'
          SKILLS: '*'
          AGENTS: '{{.AGENTS}}'
      - if: '{{ne .SKILLS "*"}}'
        task: install-selected-skills-from-repo
        vars:
          REPO: '{{.REPO}}'
          SKILLS: '{{.SKILLS}}'

  install-all-skills-from-repo:
    desc: |
      Install all agent skills from the specified GitHub repository.
      Optional inputs:
      REPO (GitHub repository in the format "owner/repo"),
      AGENTS (optional, comma-separated list of agent names)
    cmds:
      - gh skill install "{{.REPO}}" --all --scope "user" --agent universal --upstream --force
      - task: link-repo-skills-to-many-agents
        vars:
          REPO: '{{.REPO}}'

  install-selected-skills-from-repo:
    desc: |
      Install selected agent skills from the specified GitHub repository.
      Optional inputs:
      REPO (GitHub repository in the format "owner/repo"),
      SKILLS (comma-separated list of skill names),
      AGENTS (optional, comma-separated list of agent names)
    cmds:
      - for:
          var: SKILLS
          split: ','
        task: install-one-skill-from-repo
        vars:
          REPO: '{{.REPO}}'
          SKILL: '{{.ITEM}}'

  install-all-local-skills:
    desc: |
      Install all agent skills from this repository.
      Optional inputs:
      AGENTS (optional, comma-separated list of agent names)
    cmds:
      - gh skill install . --all --from-local --scope "user" --agent universal --force
      - task: link-repo-skills-to-many-agents
        vars:
          REPO:
            sh: echo $PWD

  install-one-skill-from-repo:
    desc: |
      Install a single agent skill from the specified GitHub repository.
      Optional inputs:
      REPO (GitHub repository in the format "owner/repo"),
      SKILL (skill name),
      AGENTS (optional, comma-separated list of agent names)
    cmds:
      - gh skill install "{{.REPO}}" "{{.SKILL}}" --scope "user" --agent universal --upstream --force
      - task: link-one-skill-to-many-agents
        vars:
          SKILL: '{{.SKILL}}'
          # AGENTS: '{{.AGENTS}}'

  link-repo-skills-to-many-agents:
    desc: |
      Create symbolic link from the universal agent skills of a repository to the respective agent-specific skill directories.
      Optional inputs:
      REPO (GitHub repository in the format "owner/repo" OR the local file path for local agent skills),
      AGENTS (optional, comma-separated list of agent names)
    vars:
      SKILLS:
        sh: |
          gh skill list \
            --scope user \
            --agent universal \
            --json skillName,sourceURL \
            --jq '.[] | select(.sourceURL | contains("{{.REPO}}")) | .skillName' |
            sed 's|^[^/]*/||'
    cmds:
      - for:
          var: SKILLS
        task: link-one-skill-to-many-agents
        vars:
          SKILL: '{{.ITEM}}'

  link-one-skill-to-many-agents:
    desc: |
      Create symbolic link from the universal agent skill to the list of agent-specific skill directories.
      Optional inputs:
      SKILL (skill name),
      AGENTS (optional, comma-separated list of agent names)
    cmds:
      - for:
          var: AGENTS
          split: ','
        task: link-one-skill-to-one-agent
        vars:
          SKILL: '{{.SKILL}}'
          AGENT: '{{.ITEM}}'

  link-one-skill-to-one-agent:
    desc: |
      Create symbolic link from the universal agent skill to the agent-specific skill directory.
      Optional inputs:
      SKILL (skill name),
      AGENT (agent name)
    vars:
      SKILL_DIR: '{{dig .AGENT "" .SKILL_DIRS}}'
    cmds:
      - cmd: echo "Removing exiting skill directory {{.SKILL_DIR}}/{{.SKILL}}" && rm -rf "{{.SKILL_DIR}}/{{.SKILL}}"
        if: '[ -d "{{.SKILL_DIR}}/{{.SKILL}}" ]'
      - echo "Linking universal skill {{.SKILL}} to {{.AGENT}} skill directory {{.SKILL_DIR}}..."
      - ln -sf "$HOME/.agents/skills/{{.SKILL}}" "{{.SKILL_DIR}}"
